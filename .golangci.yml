version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - nilerr
    - misspell
    - revive
    - wrapcheck
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: errorf
        - name: import-shadowing
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, wrapcheck, bodyclose]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/voska/satmux]
